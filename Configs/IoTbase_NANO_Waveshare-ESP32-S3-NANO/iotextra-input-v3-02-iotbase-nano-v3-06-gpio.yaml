# IoTextra Input 3.02 + IoTbase NANO 3.06 + Waveshare ESP32-S3-Nano — GPIO mode (HOST AP0..AP7)
# Source: IoTbase/NANO/v.3.06/host-map.yaml (esp32-s3-nano) + IoTextra-Digital/Input/v.3.02/host-map.yaml
# Inputs IN1..IN8: active-low on the HOST line (input active = 0)
esphome:
  name: input-nano-s3
  project:
    name: makethingshappy.iotextra-input-v3-02-iotbase-nano-v3-06-gpio
    version: "1.01"

esp32:
  variant: esp32s3
  flash_size: 16MB          # Waveshare ESP32-S3-Nano: 16 MB flash
  framework:
    type: esp-idf

# The board also has 8 MB octal PSRAM; it is not needed here and is left off.

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

dashboard_import:
  package_import_url: github://makethingshappy/MTH-for-ESPHome/Configs/IoTbase_NANO_Waveshare-ESP32-S3-NANO/iotextra-input-v3-02-iotbase-nano-v3-06-gpio.yaml@main
  import_full_config: false

# HOST I2C on IoTbase NANO: SDA = A4 = GPIO11, SCL = A5 = GPIO12
i2c:
  id: host_i2c
  sda: GPIO11
  scl: GPIO12
  scan: true

binary_sensor:
  - {platform: gpio, id: in1, name: "IN1", pin: {number: GPIO9, inverted: true}}   # AP0 = D6
  - {platform: gpio, id: in2, name: "IN2", pin: {number: GPIO10, inverted: true}}   # AP1 = D7
  - {platform: gpio, id: in3, name: "IN3", pin: {number: GPIO17, inverted: true}}   # AP2 = D8
  - {platform: gpio, id: in4, name: "IN4", pin: {number: GPIO18, inverted: true}}   # AP3 = D9
  - {platform: gpio, id: in5, name: "IN5", pin: {number: GPIO4, inverted: true}}   # AP4 = A3
  - {platform: gpio, id: in6, name: "IN6", pin: {number: GPIO3, inverted: true}}   # AP5 = A2 (strapping pin)
  - {platform: gpio, id: in7, name: "IN7", pin: {number: GPIO2, inverted: true}}   # AP6 = A1
  - {platform: gpio, id: in8, name: "IN8", pin: {number: GPIO5, inverted: true}}   # AP7 = D2
