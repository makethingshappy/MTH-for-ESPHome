# IoTextra MOSFET2 3.02 + IoTbase NANO 3.06 + Waveshare ESP32-S3-Nano — GPIO mode (HOST AP0..AP7)
# Source: IoTbase/NANO/v.3.06/host-map.yaml (esp32-s3-nano) + IoTextra-Digital/MOSFET2/v.3.02/host-map.yaml
# Outputs DO1..DO8: MOSFET, active-low on the HOST line (output on = 0)
esphome:
  name: mosfet2-nano-s3
  project:
    name: makethingshappy.iotextra-mosfet2-v3-02-iotbase-nano-v3-06-gpio
    version: "1.01"

esp32:
  variant: esp32s3
  flash_size: 16MB          # Waveshare ESP32-S3-Nano: 16 MB flash
  framework:
    type: esp-idf

# The board also has 8 MB octal PSRAM; it is not needed here and is left off.

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

dashboard_import:
  package_import_url: github://makethingshappy/MTH-for-ESPHome/Configs/IoTbase_NANO_Waveshare-ESP32-S3-NANO/iotextra-mosfet2-v3-02-iotbase-nano-v3-06-gpio.yaml@main
  import_full_config: false

# HOST I2C on IoTbase NANO: SDA = A4 = GPIO11, SCL = A5 = GPIO12
i2c:
  id: host_i2c
  sda: GPIO11
  scl: GPIO12
  scan: true

switch:
  - {platform: gpio, id: do1, name: "DO1", pin: {number: GPIO9, inverted: true}, restore_mode: ALWAYS_OFF}    # AP0 = D6, group S
  - {platform: gpio, id: do2, name: "DO2", pin: {number: GPIO10, inverted: true}, restore_mode: ALWAYS_OFF}   # AP1 = D7, group S
  - {platform: gpio, id: do3, name: "DO3", pin: {number: GPIO17, inverted: true}, restore_mode: ALWAYS_OFF}   # AP2 = D8, group S
  - {platform: gpio, id: do4, name: "DO4", pin: {number: GPIO18, inverted: true}, restore_mode: ALWAYS_OFF}   # AP3 = D9, group S
  - {platform: gpio, id: do5, name: "DO5", pin: {number: GPIO4, inverted: true}, restore_mode: ALWAYS_OFF}    # AP4 = A3, group N
  - {platform: gpio, id: do6, name: "DO6", pin: {number: GPIO3, inverted: true}, restore_mode: ALWAYS_OFF}    # AP5 = A2, group N (strapping pin)
  - {platform: gpio, id: do7, name: "DO7", pin: {number: GPIO2, inverted: true}, restore_mode: ALWAYS_OFF}    # AP6 = A1, group N
  - {platform: gpio, id: do8, name: "DO8", pin: {number: GPIO5, inverted: true}, restore_mode: ALWAYS_OFF}    # AP7 = D2, group N
