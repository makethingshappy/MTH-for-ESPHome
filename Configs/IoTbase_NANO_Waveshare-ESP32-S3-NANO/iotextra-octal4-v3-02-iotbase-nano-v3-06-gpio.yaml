# IoTextra Octal4 3.02 + IoTbase NANO 3.06 + Waveshare ESP32-S3-Nano — GPIO mode (HOST AP0..AP7)
# Source: IoTbase/NANO/v.3.06/host-map.yaml (esp32-s3-nano) + IoTextra-Digital/Octal4/v.3.02/host-map.yaml
# Inputs DI1..DI4: ISO1211, active-high on the HOST line (input active = 1)
# Relays K1..K4 (terminals RS1..RS4): active-low on the HOST line (relay on = 0)
# Requires SB6 closed (HOST AP4 -> K1). With SB5 closed AP4 is TCA9534 INT: K1 will not work.
# Status: not yet verified on hardware
esphome:
  name: octal4-nano-s3

esp32:
  variant: esp32s3
  flash_size: 16MB          # Waveshare ESP32-S3-Nano: 16 MB flash
  framework:
    type: esp-idf

# The board also has 8 MB octal PSRAM; it is not needed here and is left off.

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

# HOST I2C on IoTbase NANO: SDA = A4 = GPIO11, SCL = A5 = GPIO12
i2c:
  id: host_i2c
  sda: GPIO11
  scl: GPIO12
  scan: true

binary_sensor:
  - {platform: gpio, name: "DI1", pin: {number: GPIO9}}    # AP0 = D6
  - {platform: gpio, name: "DI2", pin: {number: GPIO10}}    # AP1 = D7
  - {platform: gpio, name: "DI3", pin: {number: GPIO17}}   # AP2 = D8
  - {platform: gpio, name: "DI4", pin: {number: GPIO18}}   # AP3 = D9

switch:
  - {platform: gpio, name: "K1", pin: {number: GPIO4, inverted: true}, restore_mode: ALWAYS_OFF}   # AP4 = A3 via SB6, RS1
  - {platform: gpio, name: "K2", pin: {number: GPIO3, inverted: true}, restore_mode: ALWAYS_OFF}   # AP5 = A2, RS2 (strapping pin)
  - {platform: gpio, name: "K3", pin: {number: GPIO2, inverted: true}, restore_mode: ALWAYS_OFF}   # AP6 = A1, RS3
  - {platform: gpio, name: "K4", pin: {number: GPIO5, inverted: true}, restore_mode: ALWAYS_OFF}   # AP7 = D2, RS4
