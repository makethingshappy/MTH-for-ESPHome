# IoTextra Relay2 3.02 + IoTbase NANO 3.06 + Waveshare ESP32-S3-Nano — GPIO mode (HOST AP0..AP7)
# Source: IoTbase/NANO/v.3.06/host-map.yaml (esp32-s3-nano) + IoTextra-Digital/Relay2/v3.02/host-map.yaml
# Outputs RL1..RL4: SPDT relays K1..K4, active-low on the HOST line (output on = 0)
# AP4..AP7 not used by the module (TCA9534 P4..P7 only)
# Status: not yet verified on hardware
esphome:
  name: relay2-nano-s3

esp32:
  variant: esp32s3
  flash_size: 16MB          # Waveshare ESP32-S3-Nano: 16 MB flash
  framework:
    type: esp-idf

# The board also has 8 MB octal PSRAM; it is not needed here and is left off.

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

# HOST I2C on IoTbase NANO: SDA = A4 = GPIO11, SCL = A5 = GPIO12
i2c:
  id: host_i2c
  sda: GPIO11
  scl: GPIO12
  scan: true

switch:
  - {platform: gpio, name: "RL1", pin: {number: GPIO9,   inverted: true}, restore_mode: ALWAYS_OFF}   # AP0 = D6, K1
  - {platform: gpio, name: "RL2", pin: {number: GPIO10,   inverted: true}, restore_mode: ALWAYS_OFF}   # AP1 = D7, K2
  - {platform: gpio, name: "RL3", pin: {number: GPIO17,  inverted: true}, restore_mode: ALWAYS_OFF}   # AP2 = D8, K3
  - {platform: gpio, name: "RL4", pin: {number: GPIO18,  inverted: true}, restore_mode: ALWAYS_OFF}   # AP3 = D9, K4
