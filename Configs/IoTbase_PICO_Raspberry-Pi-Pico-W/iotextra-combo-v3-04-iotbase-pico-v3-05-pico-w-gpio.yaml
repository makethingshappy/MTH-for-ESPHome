# IoTextra Combo 3.04 + IoTbase PICO 3.05 + Raspberry Pi Pico W — relays via GPIO (HOST AP0, AP1), analog via I2C (ADS1115)
# Source: IoTbase/PICO/v.3.05/host-map.yaml (pico) + IoTextra-Combo/Combo/v.3.03_and_v.3.04/host-map.yaml
# Relays RL1, RL2: active-low on the HOST line (relay on = 0)
# Analog AI1, AI2: differential, op-amp output vs 2.5 V reference.
#   Vin [V]  = Vdiff * 105k / R           (R = 24.95k default -> factor 4.2084)
#   Iin [mA] = Vin / 248.7 ohm * 1000      (R = 24.95k default -> factor 16.922)
# Per-channel settings (substitutions below), R = 24.95k:
#   range              gain    factor   unit
#   0-10V / ±10V       4.096   4.2084   V
#   0-5V  / ±5V        2.048   4.2084   V
#   0-0.5V / ±0.5V     0.256   4.2084   V
#   0-20/4-20/±20 mA   2.048   16.922   mA
#   0-40 mA            4.096   16.922   mA
# Status: not yet verified on hardware
substitutions:
  ai1_gain: "4.096"
  ai1_factor: "4.2084"
  ai1_unit: "V"
  ai2_gain: "4.096"
  ai2_factor: "4.2084"
  ai2_unit: "V"

esphome:
  name: combo-pico-w

rp2:
  board: rpipicow

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

# HOST I2C on IoTbase PICO: SDA = pin 26 = GP20, SCL = pin 27 = GP21 (RP2040 I2C0)
i2c:
  id: host_i2c
  sda: GPIO20
  scl: GPIO21
  scan: true

switch:
  - {platform: gpio, name: "RL1", pin: {number: GPIO10, inverted: true}, restore_mode: ALWAYS_OFF}   # AP0 = pin 14, K1
  - {platform: gpio, name: "RL2", pin: {number: GPIO11, inverted: true}, restore_mode: ALWAYS_OFF}   # AP1 = pin 15, K2

ads1115:
  - id: ads_u2
    address: 0x49       # SB2 open (default); 0x48 if SB2 closed

sensor:
  - platform: ads1115
    ads1115_id: ads_u2
    name: "AI1"
    multiplexer: A0_A1
    gain: ${ai1_gain}
    unit_of_measurement: ${ai1_unit}
    accuracy_decimals: 3
    update_interval: 2s
    filters:
      - multiply: ${ai1_factor}
  - platform: ads1115
    ads1115_id: ads_u2
    name: "AI2"
    multiplexer: A2_A3
    gain: ${ai2_gain}
    unit_of_measurement: ${ai2_unit}
    accuracy_decimals: 3
    update_interval: 2s
    filters:
      - multiply: ${ai2_factor}
