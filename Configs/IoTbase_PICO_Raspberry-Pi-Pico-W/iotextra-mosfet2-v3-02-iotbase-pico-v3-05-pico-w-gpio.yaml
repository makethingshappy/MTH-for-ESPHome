# IoTextra MOSFET2 3.02 + IoTbase PICO 3.05 + Raspberry Pi Pico W — GPIO mode (HOST AP0..AP7)
# Source: IoTbase/PICO/v.3.05/host-map.yaml (pico) + IoTextra-Digital/MOSFET2/v.3.02/host-map.yaml
# Outputs DO1..DO8: MOSFET, active-low on the HOST line (output on = 0)
esphome:
  name: mosfet2-pico-w
  project:
    name: makethingshappy.iotextra-mosfet2-v3-02-iotbase-pico-v3-05-pico-w-gpio
    version: "1.01"

rp2:
  board: rpipicow

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

dashboard_import:
  package_import_url: github://makethingshappy/MTH-for-ESPHome/Configs/IoTbase_PICO_Raspberry-Pi-Pico-W/iotextra-mosfet2-v3-02-iotbase-pico-v3-05-pico-w-gpio.yaml@main
  import_full_config: false

# HOST I2C on IoTbase PICO: SDA = pin 26 = GP20, SCL = pin 27 = GP21 (RP2040 I2C0)
i2c:
  id: host_i2c
  sda: GPIO20
  scl: GPIO21
  scan: true

switch:
  - {platform: gpio, id: do1, name: "DO1", pin: {number: GPIO10, inverted: true}, restore_mode: ALWAYS_OFF}    # AP0 = pin 14, group S
  - {platform: gpio, id: do2, name: "DO2", pin: {number: GPIO11, inverted: true}, restore_mode: ALWAYS_OFF}   # AP1 = pin 15, group S
  - {platform: gpio, id: do3, name: "DO3", pin: {number: GPIO12, inverted: true}, restore_mode: ALWAYS_OFF}   # AP2 = pin 16, group S
  - {platform: gpio, id: do4, name: "DO4", pin: {number: GPIO13, inverted: true}, restore_mode: ALWAYS_OFF}   # AP3 = pin 17, group S
  - {platform: gpio, id: do5, name: "DO5", pin: {number: GPIO14, inverted: true}, restore_mode: ALWAYS_OFF}    # AP4 = pin 19, group N
  - {platform: gpio, id: do6, name: "DO6", pin: {number: GPIO15, inverted: true}, restore_mode: ALWAYS_OFF}    # AP5 = pin 20, group N
  - {platform: gpio, id: do7, name: "DO7", pin: {number: GPIO18, inverted: true}, restore_mode: ALWAYS_OFF}    # AP6 = pin 24, group N
  - {platform: gpio, id: do8, name: "DO8", pin: {number: GPIO19, inverted: true}, restore_mode: ALWAYS_OFF}    # AP7 = pin 25, group N
