# IoTextra Octal2 3.02 + IoTbase PICO 3.05 + Raspberry Pi Pico W — GPIO mode (HOST AP0..AP7)
# Source: IoTbase/PICO/v.3.05/host-map.yaml (pico) + IoTextra-Digital/Octal2/v.3.02/host-map.yaml
# All channels active-low on the HOST line: input active = 0, output on = 0
esphome:
  name: octal2-pico-w
  project:
    name: makethingshappy.iotextra-octal2-v3-02-iotbase-pico-v3-05-pico-w-gpio
    version: "1.01"

rp2:
  board: rpipicow

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

dashboard_import:
  package_import_url: github://makethingshappy/MTH-for-ESPHome/Configs/IoTbase_PICO_Raspberry-Pi-Pico-W/iotextra-octal2-v3-02-iotbase-pico-v3-05-pico-w-gpio.yaml@main
  import_full_config: false

# HOST I2C on IoTbase PICO: SDA = pin 26 = GP20, SCL = pin 27 = GP21 (RP2040 I2C0)
i2c:
  id: host_i2c
  sda: GPIO20
  scl: GPIO21
  scan: true

binary_sensor:
  - {platform: gpio, id: in1, name: "IN1", pin: {number: GPIO10, inverted: true}}   # AP0 = pin 14
  - {platform: gpio, id: in2, name: "IN2", pin: {number: GPIO11, inverted: true}}   # AP1 = pin 15
  - {platform: gpio, id: in3, name: "IN3", pin: {number: GPIO12, inverted: true}}   # AP2 = pin 16
  - {platform: gpio, id: in4, name: "IN4", pin: {number: GPIO13, inverted: true}}   # AP3 = pin 17

switch:
  - {platform: gpio, id: do1, name: "DO1", pin: {number: GPIO14, inverted: true}, restore_mode: ALWAYS_OFF}   # AP4 = pin 19
  - {platform: gpio, id: do2, name: "DO2", pin: {number: GPIO15, inverted: true}, restore_mode: ALWAYS_OFF}   # AP5 = pin 20
  - {platform: gpio, id: do3, name: "DO3", pin: {number: GPIO18, inverted: true}, restore_mode: ALWAYS_OFF}   # AP6 = pin 24
  - {platform: gpio, id: do4, name: "DO4", pin: {number: GPIO19, inverted: true}, restore_mode: ALWAYS_OFF}   # AP7 = pin 25
