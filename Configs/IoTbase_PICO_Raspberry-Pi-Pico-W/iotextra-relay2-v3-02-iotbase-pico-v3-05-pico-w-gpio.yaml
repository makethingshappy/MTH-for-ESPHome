# IoTextra Relay2 3.02 + IoTbase PICO 3.05 + Raspberry Pi Pico W — GPIO mode (HOST AP0..AP7)
# Source: IoTbase/PICO/v.3.05/host-map.yaml (pico) + IoTextra-Digital/Relay2/v3.02/host-map.yaml
# Outputs RL1..RL4: SPDT relays K1..K4, active-low on the HOST line (output on = 0)
# AP4..AP7 not used by the module (TCA9534 P4..P7 only)
esphome:
  name: relay2-pico-w
  project:
    name: makethingshappy.iotextra-relay2-v3-02-iotbase-pico-v3-05-pico-w-gpio
    version: "1.01"

rp2:
  board: rpipicow

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

dashboard_import:
  package_import_url: github://makethingshappy/MTH-for-ESPHome/Configs/IoTbase_PICO_Raspberry-Pi-Pico-W/iotextra-relay2-v3-02-iotbase-pico-v3-05-pico-w-gpio.yaml@main
  import_full_config: false

# HOST I2C on IoTbase PICO: SDA = pin 26 = GP20, SCL = pin 27 = GP21 (RP2040 I2C0)
i2c:
  id: host_i2c
  sda: GPIO20
  scl: GPIO21
  scan: true

switch:
  - {platform: gpio, id: rl1, name: "RL1", pin: {number: GPIO10,   inverted: true}, restore_mode: ALWAYS_OFF}   # AP0 = pin 14, K1
  - {platform: gpio, id: rl2, name: "RL2", pin: {number: GPIO11,   inverted: true}, restore_mode: ALWAYS_OFF}   # AP1 = pin 15, K2
  - {platform: gpio, id: rl3, name: "RL3", pin: {number: GPIO12,  inverted: true}, restore_mode: ALWAYS_OFF}   # AP2 = pin 16, K3
  - {platform: gpio, id: rl4, name: "RL4", pin: {number: GPIO13,  inverted: true}, restore_mode: ALWAYS_OFF}   # AP3 = pin 17, K4
