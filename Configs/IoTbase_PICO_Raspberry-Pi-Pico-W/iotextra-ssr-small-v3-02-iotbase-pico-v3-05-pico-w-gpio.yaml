# IoTextra SSR Small 3.02 + IoTbase PICO 3.05 + Raspberry Pi Pico W — GPIO mode (HOST AP0..AP7)
# Source: IoTbase/PICO/v.3.05/host-map.yaml (pico) + IoTextra-Digital/SSR Small/v.3.02/host-map.yaml
# Outputs RL1..RL8: SSR, active-low on the HOST line (output on = 0)
esphome:
  name: ssr-small-pico-w
  project:
    name: makethingshappy.iotextra-ssr-small-v3-02-iotbase-pico-v3-05-pico-w-gpio
    version: "1.01"

rp2:
  board: rpipicow

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

dashboard_import:
  package_import_url: github://makethingshappy/MTH-for-ESPHome/Configs/IoTbase_PICO_Raspberry-Pi-Pico-W/iotextra-ssr-small-v3-02-iotbase-pico-v3-05-pico-w-gpio.yaml@main
  import_full_config: false

# HOST I2C on IoTbase PICO: SDA = pin 26 = GP20, SCL = pin 27 = GP21 (RP2040 I2C0)
i2c:
  id: host_i2c
  sda: GPIO20
  scl: GPIO21
  scan: true

switch:
  - {platform: gpio, id: rl1, name: "RL1", pin: {number: GPIO10, inverted: true}, restore_mode: ALWAYS_OFF}   # AP0 = pin 14, DO1
  - {platform: gpio, id: rl2, name: "RL2", pin: {number: GPIO11, inverted: true}, restore_mode: ALWAYS_OFF}   # AP1 = pin 15, DO2
  - {platform: gpio, id: rl3, name: "RL3", pin: {number: GPIO12, inverted: true}, restore_mode: ALWAYS_OFF}   # AP2 = pin 16, DO3
  - {platform: gpio, id: rl4, name: "RL4", pin: {number: GPIO13, inverted: true}, restore_mode: ALWAYS_OFF}   # AP3 = pin 17, DO4
  - {platform: gpio, id: rl5, name: "RL5", pin: {number: GPIO14, inverted: true}, restore_mode: ALWAYS_OFF}   # AP4 = pin 19, DO5
  - {platform: gpio, id: rl6, name: "RL6", pin: {number: GPIO15, inverted: true}, restore_mode: ALWAYS_OFF}   # AP5 = pin 20, DO6
  - {platform: gpio, id: rl7, name: "RL7", pin: {number: GPIO18, inverted: true}, restore_mode: ALWAYS_OFF}   # AP6 = pin 24, DO7
  - {platform: gpio, id: rl8, name: "RL8", pin: {number: GPIO19, inverted: true}, restore_mode: ALWAYS_OFF}   # AP7 = pin 25, DO8
