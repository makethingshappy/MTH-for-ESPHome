# IoTextra Combo 3.04 + IoTsmart XIAO 1.02 + XIAO ESP32-S3 — relays via GPIO (HOST AP0, AP1), analog via I2C (ADS1115)
# Source: IoTsmart/XIAO/v.1.02/host-map.yaml (xiao-esp32s3) + IoTextra-Combo/Combo/v.3.03_and_v.3.04/host-map.yaml
# Relays RL1, RL2: active-low on the HOST line (relay on = 0)
# Analog AI1, AI2: differential, op-amp output vs 2.5 V reference.
#   Vin [V]  = Vdiff * 105k / R           (R = 24.95k default -> factor 4.2084)
#   Iin [mA] = Vin / 248.7 ohm * 1000      (R = 24.95k default -> factor 16.922)
# Per-channel settings (substitutions below), R = 24.95k:
#   range              gain    factor   unit
#   0-10V / ±10V       4.096   4.2084   V
#   0-5V  / ±5V        2.048   4.2084   V
#   0-0.5V / ±0.5V     0.256   4.2084   V
#   0-20/4-20/±20 mA   2.048   16.922   mA
#   0-40 mA            4.096   16.922   mA
# Status: not yet verified on hardware
substitutions:
  ai1_gain: "4.096"
  ai1_factor: "4.2084"
  ai1_unit: "V"
  ai2_gain: "4.096"
  ai2_factor: "4.2084"
  ai2_unit: "V"

esphome:
  name: combo-xiao-s3

esp32:
  variant: esp32s3
  flash_size: 8MB           # Seeed XIAO ESP32-S3: 8 MB flash
  framework:
    type: esp-idf

# The board also has 8 MB octal PSRAM; it is not needed here and is left off.

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

# HOST I2C on IoTsmart XIAO: SDA = D4 = GPIO5, SCL = D5 = GPIO6 (onboard EEPROM 0x54-0x57 on the same bus)
i2c:
  id: host_i2c
  sda: GPIO5
  scl: GPIO6
  scan: true

switch:
  - {platform: gpio, name: "RL1", pin: {number: GPIO8, inverted: true}, restore_mode: ALWAYS_OFF}   # AP0 = D9, K1
  - {platform: gpio, name: "RL2", pin: {number: GPIO9, inverted: true}, restore_mode: ALWAYS_OFF}   # AP1 = D10, K2

ads1115:
  - id: ads_u2
    address: 0x49       # SB2 open (default); 0x48 if SB2 closed

sensor:
  - platform: ads1115
    ads1115_id: ads_u2
    name: "AI1"
    multiplexer: A0_A1
    gain: ${ai1_gain}
    unit_of_measurement: ${ai1_unit}
    accuracy_decimals: 3
    update_interval: 2s
    filters:
      - multiply: ${ai1_factor}
  - platform: ads1115
    ads1115_id: ads_u2
    name: "AI2"
    multiplexer: A2_A3
    gain: ${ai2_gain}
    unit_of_measurement: ${ai2_unit}
    accuracy_decimals: 3
    update_interval: 2s
    filters:
      - multiply: ${ai2_factor}
