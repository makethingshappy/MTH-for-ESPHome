# IoTextra MOSFET2 3.02 + IoTsmart XIAO 1.02 + XIAO ESP32-S3 — GPIO mode (HOST AP0..AP7)
# Source: IoTsmart/XIAO/v.1.02/host-map.yaml (xiao-esp32s3) + IoTextra-Digital/MOSFET2/v.3.02/host-map.yaml
# Outputs DO1..DO8: MOSFET, active-low on the HOST line (output on = 0)
esphome:
  name: mosfet2-xiao-s3
  project:
    name: makethingshappy.iotextra-mosfet2-v3-02-iotsmart-xiao-v1-02-gpio
    version: "1.01"

esp32:
  variant: esp32s3
  flash_size: 8MB           # Seeed XIAO ESP32-S3: 8 MB flash
  framework:
    type: esp-idf

# The board also has 8 MB octal PSRAM; it is not needed here and is left off.

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

dashboard_import:
  package_import_url: github://makethingshappy/MTH-for-ESPHome/Configs/IoTsmart_XIAO_XIAO-ESP32-S3/iotextra-mosfet2-v3-02-iotsmart-xiao-v1-02-gpio.yaml@main
  import_full_config: false

# HOST I2C on IoTsmart XIAO: SDA = D4 = GPIO5, SCL = D5 = GPIO6 (onboard EEPROM 0x54-0x57 on the same bus)
i2c:
  id: host_i2c
  sda: GPIO5
  scl: GPIO6
  scan: true

switch:
  - {platform: gpio, id: do1, name: "DO1", pin: {number: GPIO8, inverted: true}, restore_mode: ALWAYS_OFF}   # AP0 = D9, group S
  - {platform: gpio, id: do2, name: "DO2", pin: {number: GPIO9, inverted: true}, restore_mode: ALWAYS_OFF}   # AP1 = D10, group S
  - {platform: gpio, id: do3, name: "DO3", pin: {number: GPIO7, inverted: true}, restore_mode: ALWAYS_OFF}   # AP2 = D8, group S
  - {platform: gpio, id: do4, name: "DO4", pin: {number: GPIO44, inverted: true}, restore_mode: ALWAYS_OFF}   # AP3 = D7, group S (GPIO44 = UART0 RX)
  - {platform: gpio, id: do5, name: "DO5", pin: {number: GPIO1, inverted: true}, restore_mode: ALWAYS_OFF}   # AP4 = D0, group N
  - {platform: gpio, id: do6, name: "DO6", pin: {number: GPIO2, inverted: true}, restore_mode: ALWAYS_OFF}   # AP5 = D1, group N
  - {platform: gpio, id: do7, name: "DO7", pin: {number: GPIO3, inverted: true}, restore_mode: ALWAYS_OFF}   # AP6 = D2, group N (strapping pin)
  - {platform: gpio, id: do8, name: "DO8", pin: {number: GPIO4, inverted: true}, restore_mode: ALWAYS_OFF}   # AP7 = D3, group N
