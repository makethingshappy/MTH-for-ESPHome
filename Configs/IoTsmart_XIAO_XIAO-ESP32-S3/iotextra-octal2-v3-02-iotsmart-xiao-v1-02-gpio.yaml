# IoTextra Octal2 3.02 + IoTsmart XIAO 1.02 + XIAO ESP32-S3 — GPIO mode (HOST AP0..AP7)
# Source: IoTsmart/XIAO/v.1.02/host-map.yaml (xiao-esp32s3) + IoTextra-Digital/Octal2/v.3.02/host-map.yaml
# All channels active-low on the HOST line: input active = 0, output on = 0
esphome:
  name: octal2-xiao-s3
  project:
    name: makethingshappy.iotextra-octal2-v3-02-iotsmart-xiao-v1-02-gpio
    version: "1.01"

esp32:
  variant: esp32s3
  flash_size: 8MB           # Seeed XIAO ESP32-S3: 8 MB flash
  framework:
    type: esp-idf

# The board also has 8 MB octal PSRAM; it is not needed here and is left off.

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

dashboard_import:
  package_import_url: github://makethingshappy/MTH-for-ESPHome/Configs/IoTsmart_XIAO_XIAO-ESP32-S3/iotextra-octal2-v3-02-iotsmart-xiao-v1-02-gpio.yaml@main
  import_full_config: false

# HOST I2C on IoTsmart XIAO: SDA = D4 = GPIO5, SCL = D5 = GPIO6 (onboard EEPROM 0x54-0x57 on the same bus)
i2c:
  id: host_i2c
  sda: GPIO5
  scl: GPIO6
  scan: true

binary_sensor:
  - {platform: gpio, id: in1, name: "IN1", pin: {number: GPIO8, inverted: true}}   # AP0 = D9
  - {platform: gpio, id: in2, name: "IN2", pin: {number: GPIO9, inverted: true}}   # AP1 = D10
  - {platform: gpio, id: in3, name: "IN3", pin: {number: GPIO7, inverted: true}}   # AP2 = D8
  - {platform: gpio, id: in4, name: "IN4", pin: {number: GPIO44, inverted: true}}   # AP3 = D7 (GPIO44 = UART0 RX)

switch:
  - {platform: gpio, id: do1, name: "DO1", pin: {number: GPIO1, inverted: true}, restore_mode: ALWAYS_OFF}   # AP4 = D0
  - {platform: gpio, id: do2, name: "DO2", pin: {number: GPIO2, inverted: true}, restore_mode: ALWAYS_OFF}   # AP5 = D1
  - {platform: gpio, id: do3, name: "DO3", pin: {number: GPIO3, inverted: true}, restore_mode: ALWAYS_OFF}   # AP6 = D2 (strapping pin)
  - {platform: gpio, id: do4, name: "DO4", pin: {number: GPIO4, inverted: true}, restore_mode: ALWAYS_OFF}   # AP7 = D3
