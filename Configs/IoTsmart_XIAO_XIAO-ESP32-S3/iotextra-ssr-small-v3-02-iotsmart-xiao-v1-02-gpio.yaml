# IoTextra SSR Small 3.02 + IoTsmart XIAO 1.02 + XIAO ESP32-S3 — GPIO mode (HOST AP0..AP7)
# Source: IoTsmart/XIAO/v.1.02/host-map.yaml (xiao-esp32s3) + IoTextra-Digital/SSR Small/v.3.02/host-map.yaml
# Outputs RL1..RL8: SSR, active-low on the HOST line (output on = 0)
esphome:
  name: ssr-small-xiao-s3
  project:
    name: makethingshappy.iotextra-ssr-small-v3-02-iotsmart-xiao-v1-02-gpio
    version: "1.01"

esp32:
  variant: esp32s3
  flash_size: 8MB           # Seeed XIAO ESP32-S3: 8 MB flash
  framework:
    type: esp-idf

# The board also has 8 MB octal PSRAM; it is not needed here and is left off.

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

dashboard_import:
  package_import_url: github://makethingshappy/MTH-for-ESPHome/Configs/IoTsmart_XIAO_XIAO-ESP32-S3/iotextra-ssr-small-v3-02-iotsmart-xiao-v1-02-gpio.yaml@main
  import_full_config: false

# HOST I2C on IoTsmart XIAO: SDA = D4 = GPIO5, SCL = D5 = GPIO6 (onboard EEPROM 0x54-0x57 on the same bus)
i2c:
  id: host_i2c
  sda: GPIO5
  scl: GPIO6
  scan: true

switch:
  - {platform: gpio, id: rl1, name: "RL1", pin: {number: GPIO8, inverted: true}, restore_mode: ALWAYS_OFF}   # AP0 = D9, DO1
  - {platform: gpio, id: rl2, name: "RL2", pin: {number: GPIO9, inverted: true}, restore_mode: ALWAYS_OFF}   # AP1 = D10, DO2
  - {platform: gpio, id: rl3, name: "RL3", pin: {number: GPIO7, inverted: true}, restore_mode: ALWAYS_OFF}   # AP2 = D8, DO3
  - {platform: gpio, id: rl4, name: "RL4", pin: {number: GPIO44, inverted: true}, restore_mode: ALWAYS_OFF}   # AP3 = D7, DO4 (GPIO44 = UART0 RX)
  - {platform: gpio, id: rl5, name: "RL5", pin: {number: GPIO1, inverted: true}, restore_mode: ALWAYS_OFF}   # AP4 = D0, DO5
  - {platform: gpio, id: rl6, name: "RL6", pin: {number: GPIO2, inverted: true}, restore_mode: ALWAYS_OFF}   # AP5 = D1, DO6
  - {platform: gpio, id: rl7, name: "RL7", pin: {number: GPIO3, inverted: true}, restore_mode: ALWAYS_OFF}   # AP6 = D2, DO7 (strapping pin)
  - {platform: gpio, id: rl8, name: "RL8", pin: {number: GPIO4, inverted: true}, restore_mode: ALWAYS_OFF}   # AP7 = D3, DO8
