# IoTextra Octal4 3.02 + IoTsmart XIAO 1.02 + XIAO ESP32-S3 — GPIO mode (HOST AP0..AP7)
# Source: IoTsmart/XIAO/v.1.02/host-map.yaml (xiao-esp32s3) + IoTextra-Digital/Octal4/v.3.02/host-map.yaml
# Inputs DI1..DI4: ISO1211, active-high on the HOST line (input active = 1)
# Relays K1..K4 (terminals RS1..RS4): active-low on the HOST line (relay on = 0)
# Requires SB6 closed (HOST AP4 -> K1). With SB5 closed AP4 is TCA9534 INT: K1 will not work.
# Status: not yet verified on hardware
esphome:
  name: octal4-xiao-s3

esp32:
  variant: esp32s3
  flash_size: 8MB           # Seeed XIAO ESP32-S3: 8 MB flash
  framework:
    type: esp-idf

# The board also has 8 MB octal PSRAM; it is not needed here and is left off.

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:
web_server:
  port: 80

# HOST I2C on IoTsmart XIAO: SDA = D4 = GPIO5, SCL = D5 = GPIO6 (onboard EEPROM 0x54-0x57 on the same bus)
i2c:
  id: host_i2c
  sda: GPIO5
  scl: GPIO6
  scan: true

binary_sensor:
  - {platform: gpio, name: "DI1", pin: {number: GPIO8}}    # AP0 = D9
  - {platform: gpio, name: "DI2", pin: {number: GPIO9}}    # AP1 = D10
  - {platform: gpio, name: "DI3", pin: {number: GPIO7}}   # AP2 = D8
  - {platform: gpio, name: "DI4", pin: {number: GPIO44}}   # AP3 = D7 (GPIO44 = UART0 RX)

switch:
  - {platform: gpio, name: "K1", pin: {number: GPIO1, inverted: true}, restore_mode: ALWAYS_OFF}   # AP4 = D0 via SB6, RS1
  - {platform: gpio, name: "K2", pin: {number: GPIO2, inverted: true}, restore_mode: ALWAYS_OFF}   # AP5 = D1, RS2
  - {platform: gpio, name: "K3", pin: {number: GPIO3, inverted: true}, restore_mode: ALWAYS_OFF}   # AP6 = D2, RS3 (strapping pin)
  - {platform: gpio, name: "K4", pin: {number: GPIO4, inverted: true}, restore_mode: ALWAYS_OFF}   # AP7 = D3, RS4
